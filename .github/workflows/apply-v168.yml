name: Apply Global Edge v1.6.8 Hardening

on:
  push:
    paths:
      - 'patches/v168.patch.gz.b64'
      - '.github/workflows/apply-v168.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply v1.6.8 patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'versionCode = 168' app/build.gradle.kts; then
            echo "v1.6.8 already applied"
            exit 0
          fi
          tr -d '\r\n ' < patches/v168.patch.gz.b64 | base64 -d > /tmp/v168.patch.gz
          gzip -t /tmp/v168.patch.gz
          gzip -dc /tmp/v168.patch.gz > /tmp/v168.patch
          git apply --check --exclude=.github/workflows/android-ci.yml /tmp/v168.patch
          git apply --exclude=.github/workflows/android-ci.yml /tmp/v168.patch
          grep -q 'versionCode = 168' app/build.gradle.kts
          grep -q 'versionName = "1.6.8"' app/build.gradle.kts
          grep -q 'trusted_multify_package_v168' app/src/main/java/com/suhas/ucsentinel/notifications/MultifyNotificationService.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and release build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain clean testDebugUnitTest assembleRelease 2>&1 | tee /tmp/v168-build.log
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Commit verified v1.6.8 source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG-v1.6.8.txt app
          git commit -m 'Release Global Edge AI Trader v1.6.8 hardening'
          git push
