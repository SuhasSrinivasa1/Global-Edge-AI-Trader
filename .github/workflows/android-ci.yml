name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and release build
        shell: bash
        run: gradle --no-daemon --console=plain clean testDebugUnitTest assembleRelease

      - name: Verify v1.8.0 reliability and feature removal
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 190' app/build.gradle.kts
          grep -q 'versionName = "1.8.0"' app/build.gradle.kts
          grep -q 'scanUpperCircuitThreePm' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q '!phase.open' app/src/main/java/com/suhas/ucsentinel/domain/engine/GlobalLeadEngine.kt
          grep -q 'thresholdPool' app/src/main/java/com/suhas/ucsentinel/domain/engine/ScannerEngine.kt
          grep -q 'scanner_service_heartbeat_at_v170' app/src/main/java/com/suhas/ucsentinel/data/local/AppPreferences.kt
          grep -q 'SESSION_SYMBOL_CHURN_BLOCK' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'SESSION_KILL_SWITCH' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q '15,10' app/src/main/java/com/suhas/ucsentinel/domain/engine/AutomationPolicy.kt
          test -f app/src/main/java/com/suhas/ucsentinel/data/local/PersistentLearningVault.kt
          grep -q 'global_edge_learning_vault_control_v171' app/src/main/java/com/suhas/ucsentinel/data/local/PersistentLearningVault.kt
          grep -q 'backupLearningVaultIfDue' app/src/main/java/com/suhas/ucsentinel/worker/MarketScanService.kt
          test -f app/src/main/java/com/suhas/ucsentinel/data/local/StrategyLearningDatabase.kt
          test -f app/src/main/java/com/suhas/ucsentinel/domain/engine/StrategyGovernanceV2.kt
          grep -q 'StrategyStatus.QUALIFIED' app/src/main/java/com/suhas/ucsentinel/domain/engine/StrategyGovernanceV2.kt
          grep -q 'productionEligible' app/src/main/java/com/suhas/ucsentinel/domain/engine/StrategyGovernanceV2.kt
          grep -q 'buildFrozenRoster' app/src/main/java/com/suhas/ucsentinel/domain/engine/StrategyGovernanceV2.kt
          grep -q 'SHADOW_V2' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'componentStrategyIds' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'Portfolio selector' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q '1minute' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'schemaVersion.*SCHEMA_VERSION' app/src/main/java/com/suhas/ucsentinel/data/local/PersistentLearningVault.kt
          grep -q 'currentSessionStart' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'context-fallback' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'isTodayIst' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          ! grep -Rqi 'multify' app/src/main app/src/test
          ! grep -q 'NotificationListenerService' app/src/main/AndroidManifest.xml
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.8.0-unsigned
          retention-days: 30
          if-no-files-found: error
          path: app/build/outputs/apk/release/app-release-unsigned.apk
