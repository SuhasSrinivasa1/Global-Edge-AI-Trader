name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and release build
        shell: bash
        run: gradle --no-daemon --console=plain clean testDebugUnitTest assembleRelease

      - name: Verify v1.6.7 package metadata
        shell: bash
        run: |
          grep -q 'versionCode = 167' app/build.gradle.kts
          grep -q 'versionName = "1.6.7"' app/build.gradle.kts
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.6.7-unsigned
          retention-days: 30
          if-no-files-found: error
          path: app/build/outputs/apk/release/app-release-unsigned.apk
