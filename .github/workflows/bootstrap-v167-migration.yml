name: Bootstrap v1.6.7 Source Migration

on:
  push:
    paths:
      - '.github/workflows/bootstrap-v167-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import verified v1.6.7 source
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/SuhasSrinivasa1/AI-Trader/main/fresh-global-edge/v167/release/Global-Edge-AI-Trader-v1.6.7-source.zip"
          ZIP=/tmp/global-edge-v167-source.zip
          curl -fL --retry 4 --retry-delay 2 "$URL" -o "$ZIP"
          echo "547f3c5ce2502c96eb1855fa6270ad428a9749289a424e3903d0edf3b4cd2822  $ZIP" | sha256sum -c -

          rm -rf /tmp/global-edge-v167
          mkdir -p /tmp/global-edge-v167
          unzip -q "$ZIP" -d /tmp/global-edge-v167
          SRC=/tmp/global-edge-v167/Global-Edge-AI-Trader-v1.5.0-source
          test -f "$SRC/app/build.gradle.kts"
          grep -q 'versionCode = 167' "$SRC/app/build.gradle.kts"
          grep -q 'versionName = "1.6.7"' "$SRC/app/build.gradle.kts"

          cp -a "$SRC"/. .
          rm -rf .kotlin .gradle build app/build
          rm -f local.properties
          rm -f .github/workflows/bootstrap-v167-migration.yml

          mkdir -p .github/workflows
          cat > .github/workflows/android-ci.yml <<'YAML'
          name: Android CI

          on:
            push:
              branches: [ main ]
            pull_request:
              branches: [ main ]
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 60
              env:
                ANDROID_HOME: /usr/local/lib/android/sdk
                ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

              steps:
                - uses: actions/checkout@v4

                - uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: '17'

                - name: Install Android SDK
                  shell: bash
                  run: |
                    set -euo pipefail
                    SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
                    yes | "$SDKMANAGER" --licenses >/dev/null || true
                    "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

                - uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: '8.11.1'

                - name: Unit tests and unsigned release build
                  shell: bash
                  run: gradle --no-daemon --console=plain clean testDebugUnitTest assembleRelease

                - name: Upload unsigned release APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: Global-Edge-AI-Trader-unsigned-release
                    retention-days: 30
                    if-no-files-found: error
                    path: app/build/outputs/apk/release/*.apk
          YAML

          cat > REPOSITORY-MIGRATION.md <<'DOC'
          # Repository migration

          This repository became the canonical Global Edge AI Trader source repository on 2026-10-03.

          Baseline imported: Global Edge AI Trader v1.6.7, versionCode 167.

          The source baseline was copied from the previously verified public build history in SuhasSrinivasa1/AI-Trader and SHA-256 verified during migration.

          Signing keys and passwords are intentionally not stored in this public repository. The CI workflow validates tests and produces an unsigned release artifact. Production/update-compatible APK signing must use the preserved private signing material outside source control.
          DOC

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Import verified Global Edge AI Trader v1.6.7 source"
          git push

      - name: Verify committed source snapshot
        shell: bash
        run: |
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt

# bootstrap-trigger: 2026-10-03
