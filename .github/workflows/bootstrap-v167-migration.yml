name: Bootstrap v1.6.7 Source Migration

on:
  push:
    paths:
      - '.github/workflows/bootstrap-v167-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import verified v1.6.7 source
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/SuhasSrinivasa1/AI-Trader/main/fresh-global-edge/v167/release/Global-Edge-AI-Trader-v1.6.7-source.zip"
          ZIP=/tmp/global-edge-v167-source.zip
          curl -fL --retry 4 --retry-delay 2 "$URL" -o "$ZIP"
          echo "547f3c5ce2502c96eb1855fa6270ad428a9749289a424e3903d0edf3b4cd2822  $ZIP" | sha256sum -c -

          rm -rf /tmp/global-edge-v167
          mkdir -p /tmp/global-edge-v167
          unzip -q "$ZIP" -d /tmp/global-edge-v167
          SRC=/tmp/global-edge-v167/Global-Edge-AI-Trader-v1.5.0-source
          test -f "$SRC/app/build.gradle.kts"
          grep -q 'versionCode = 167' "$SRC/app/build.gradle.kts"
          grep -q 'versionName = "1.6.7"' "$SRC/app/build.gradle.kts"

          cp -a "$SRC"/. .
          rm -rf .kotlin .gradle build app/build
          rm -f local.properties

          cat > REPOSITORY-MIGRATION.md <<'DOC'
          # Repository migration

          This repository became the canonical Global Edge AI Trader source repository on 2026-10-03.

          Baseline imported: Global Edge AI Trader v1.6.7, versionCode 167.

          The source baseline was copied from the previously verified public build history in SuhasSrinivasa1/AI-Trader and SHA-256 verified during migration.

          Signing keys and passwords are intentionally not stored in this public repository. Production/update-compatible APK signing must use the preserved private signing material outside source control.
          DOC

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Import verified Global Edge AI Trader v1.6.7 source"
          git push

      - name: Verify committed source snapshot
        shell: bash
        run: |
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
