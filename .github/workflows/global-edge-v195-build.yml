name: Global Edge AI Trader v1.8.5 Confluence Learning Build

on:
  push:
    paths:
      - '.github/workflows/global-edge-v195-build.yml'
      - 'BUILD-V195.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout canonical build repository
        uses: actions/checkout@v4
        with:
          path: canonical-build

      - name: Checkout patch/signing repository
        uses: actions/checkout@v4
        with:
          repository: SuhasSrinivasa1/AI-Trader
          ref: main
          path: signing-repo
          persist-credentials: false

      - name: Recover verified v1.8.4 source
        uses: actions/download-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.8.4-FINAL
          repository: SuhasSrinivasa1/Global-Edge-AI-Trader
          run-id: 37962906271
          github-token: ${{ github.token }}
          path: /tmp/v184-artifact

      - name: Reconstruct and apply v1.8.5 patch
        shell: bash
        run: |
          set -euo pipefail
          cat signing-repo/fresh-global-edge/v195/patch.part00               signing-repo/fresh-global-edge/v195/patch.part01               signing-repo/fresh-global-edge/v195/patch.part02               signing-repo/fresh-global-edge/v195/patch.part03 > /tmp/v185.patch.gz.b64

          B64_SHA=$(sha256sum /tmp/v185.patch.gz.b64 | awk '{print $1}')
          test "$B64_SHA" = '06d3e0070822e66e187b3bb6d8a27a70d25f2d74f9791fab28a3ceaed7be04da'

          base64 -d /tmp/v185.patch.gz.b64 > /tmp/v185.patch.gz
          GZ_SHA=$(sha256sum /tmp/v185.patch.gz | awk '{print $1}')
          test "$GZ_SHA" = 'e49c96ff208b1c40036ed1eda6b8f3e3756f6cd66a38fdab786a4015be33824a'

          gunzip -c /tmp/v185.patch.gz > /tmp/v185.patch
          PATCH_SHA=$(sha256sum /tmp/v185.patch | awk '{print $1}')
          test "$PATCH_SHA" = 'cc153a53310d70f6dbde92dfab33af1cabbb3bfc698b16789bfbec80e1172205'

          rm -rf /tmp/v195 && mkdir -p /tmp/v195
          SRCZIP=$(find /tmp/v184-artifact -type f -name 'Global-Edge-AI-Trader-v1.8.4-source.zip' | head -n1)
          test -n "$SRCZIP" && test -s "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/v195
          cd /tmp/v195
          patch -p1 --batch < /tmp/v185.patch

      - name: Verify v1.8.5 architecture
        working-directory: /tmp/v195
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 195' app/build.gradle.kts
          grep -q 'versionName = "1.8.5"' app/build.gradle.kts

          test -f app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          test -f app/src/main/java/com/suhas/ucsentinel/data/local/ConfluenceLearningStore.kt
          test -f app/src/main/java/com/suhas/ucsentinel/data/local/WinnerExportManager.kt
          test -f app/src/test/java/com/suhas/globaledgeai/domain/engine/ConfluenceFeatureEngineTest.kt

          grep -q 'MARKER_PREFIX = "CF185\["' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          grep -q '"ORDER_BLOCK"' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          grep -q '"BOS"' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          grep -q '"CHOCH"' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          grep -q '"FVG"' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          grep -q '"LIQUIDITY_SWEEP"' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          grep -q '"ANCHORED_VWAP"' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          grep -q '"VOLUME_PROFILE"' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          grep -q '"VOLUME_ACCELERATION"' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          grep -q '"ATR_REGIME"' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          grep -q '"OPENING_RANGE"' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          grep -q '"CANDLE_SEQUENCE"' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          grep -q '"TREND_QUALITY"' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          grep -q '"MULTI_TIMEFRAME"' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          grep -q '"MICROSTRUCTURE"' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          grep -q '"BREAKOUT_QUALITY"' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          grep -q '"SECTOR_RS"' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          grep -q '"BREADTH"' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt
          grep -q '"EVENT_RISK"' app/src/main/java/com/suhas/ucsentinel/domain/engine/ConfluenceFeatureEngine.kt

          grep -q 'bundle.strategies.take(500)' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'ConfluenceLearningStore' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'WinnerExportManager' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'exportTwoPercentWinners' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'recordDiagonalResearchShadows' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'GLOBAL_EDGE_WINNER_EVIDENCE_V1' app/src/main/java/com/suhas/ucsentinel/data/local/WinnerExportManager.kt
          grep -q 'Downloads/GlobalEdgeAI/Winners' app/src/main/java/com/suhas/ucsentinel/MainActivity.kt
          grep -q 'WRITE_EXTERNAL_STORAGE.*maxSdkVersion="28"' app/src/main/AndroidManifest.xml

          grep -q 'ConfluenceFeatureEngine' app/src/main/java/com/suhas/ucsentinel/domain/engine/ScannerEngine.kt
          grep -q 'ConfluenceFeatureEngine' app/src/main/java/com/suhas/ucsentinel/domain/engine/DiagonalScannerEngine.kt
          grep -q 'confluenceLongChampions' app/src/main/java/com/suhas/ucsentinel/ui/MainViewModel.kt
          grep -q '2%+ winner evidence export' app/src/main/java/com/suhas/ucsentinel/ui/MoreScreen.kt

          # Existing v1.8.4 architecture must remain.
          grep -q 'DIAGONAL_UP' app/src/main/java/com/suhas/ucsentinel/domain/engine/DiagonalScannerEngine.kt
          grep -q 'THREE_PM("3 PM UC")' app/src/main/java/com/suhas/ucsentinel/ui/InformationArchitectureScreens.kt
          grep -q 'time>=LocalTime.of(15,0)' app/src/main/java/com/suhas/ucsentinel/domain/engine/AutomationPolicy.kt
          grep -q 'runChallengerShadowResearchOffHours' app/src/main/java/com/suhas/ucsentinel/worker/NightlyLearningWorker.kt

          echo 'v1.8.5 architecture verification passed'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and release APK
        working-directory: /tmp/v195
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          gradle --no-daemon --console=plain clean testDebugUnitTest assembleRelease 2>&1 | tee out/GRADLE-BUILD-TEST.log
          echo 'Unit tests + assembleRelease: PASS' > out/TEST-RESULT-SUMMARY.txt

      - name: Recover preserved signing material
        uses: actions/download-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.5.0-FINAL
          repository: SuhasSrinivasa1/AI-Trader
          run-id: 36146076154
          github-token: ${{ github.token }}
          path: /tmp/v150-artifact

      - name: Sign and verify preserved update certificate
        working-directory: /tmp/v195
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out /tmp/signing
          BACKUP=$(find /tmp/v150-artifact -type f -name 'Global-Edge-AI-Trader-v1.5.0-SIGNING-BACKUP.zip' | head -n1)
          test -n "$BACKUP" && test -s "$BACKUP"
          unzip -q "$BACKUP" -d /tmp/signing

          STORE_PASS=$(grep '^store_password=' /tmp/signing/SIGNING-INFO.txt | cut -d= -f2-)
          KEY_PASS=$(grep '^key_password=' /tmp/signing/SIGNING-INFO.txt | cut -d= -f2-)
          UNSIGNED=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*release*.apk' | head -n1)
          OUT=out/Global-Edge-AI-Trader-v1.8.5.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign             --ks /tmp/signing/global-edge-v1.5.0.keystore             --ks-pass pass:"$STORE_PASS"             --key-pass pass:"$KEY_PASS"             --ks-key-alias globaledge             --out "$OUT" "$UNSIGNED"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee out/APK-SIGNATURE-VERIFY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | tee out/APK-BADGING.txt

          grep -q "package: name='com.suhas.globaledgeai'" out/APK-BADGING.txt
          grep -q "versionCode='195'" out/APK-BADGING.txt
          grep -q "versionName='1.8.5'" out/APK-BADGING.txt

          CERT_SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          test "$CERT_SHA" = '31ffa51c23b76f450cf099d00b254870bf8eacc5ce79aee4458070a0fab783d7'
          sha256sum "$OUT" | tee out/SHA256.txt

          {
            echo 'build=SUCCESS'
            echo 'base=Global-Edge-AI-Trader-v1.8.4-FINAL'
            echo 'package=com.suhas.globaledgeai'
            echo 'versionCode=195'
            echo 'versionName=1.8.5'
            echo "signer_sha256=$CERT_SHA"
            echo 'update_certificate_preserved=true'
            echo 'confluence_engine=CF-1.8.5'
            echo 'independent_feature_families=true'
            echo 'order_block_bos_choch_fvg_liquidity_sweep=true'
            echo 'vwap_volume_profile_rvol_atr_opening_range=true'
            echo 'candle_trend_microstructure_breakout_sector_breadth=true'
            echo 'strategy_catalog_capacity=500'
            echo 'persistent_combo_learning=true'
            echo 'champion_requires_repeated_sessions=true'
            echo 'diagonal_confluence=true'
            echo 'global_indian_confirmation_confluence=true'
            echo 'upper_circuit_bounded_confluence=true'
            echo 'winner_export_threshold_pct=2.0'
            echo 'winner_export_path=Downloads/GlobalEdgeAI/Winners'
            echo 'winner_export_pre_move_evidence=true'
            echo 'fundamental_support_requires_real_input=true'
          } > out/BUILD-STATUS.txt

      - name: Package source and logs
        working-directory: /tmp/v195
        shell: bash
        run: |
          set -euo pipefail
          zip -qr out/Global-Edge-AI-Trader-v1.8.5-source.zip . -x '.git/*' '*/.gradle/*' '*/build/*' 'out/*' '*.keystore' '*.jks'
          cd out
          zip -q Global-Edge-AI-Trader-v1.8.5-build-logs.zip             APK-SIGNATURE-VERIFY.txt APK-BADGING.txt SHA256.txt BUILD-STATUS.txt             TEST-RESULT-SUMMARY.txt GRADLE-BUILD-TEST.log

      - name: Upload final v1.8.5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.8.5-FINAL
          retention-days: 90
          if-no-files-found: error
          path: |
            /tmp/v195/out/Global-Edge-AI-Trader-v1.8.5.apk
            /tmp/v195/out/Global-Edge-AI-Trader-v1.8.5-source.zip
            /tmp/v195/out/Global-Edge-AI-Trader-v1.8.5-build-logs.zip
            /tmp/v195/out/BUILD-STATUS.txt
