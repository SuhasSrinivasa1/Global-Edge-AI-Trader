name: Global Edge AI Trader v1.8.4 Canonical Build

on:
  push:
    paths:
      - '.github/workflows/global-edge-v184-build.yml'
      - 'BUILD-V184.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout canonical build repository
        uses: actions/checkout@v4
        with:
          path: canonical-build

      - name: Checkout patch/signing repository
        uses: actions/checkout@v4
        with:
          repository: SuhasSrinivasa1/AI-Trader
          ref: main
          path: signing-repo
          persist-credentials: false

      - name: Recover verified v1.8.3 source
        uses: actions/download-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.8.3-FINAL
          repository: SuhasSrinivasa1/AI-Trader
          run-id: 37818452613
          github-token: ${{ github.token }}
          path: /tmp/v183-artifact

      - name: Apply and verify v1.8.4 patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v194 && mkdir -p /tmp/v194
          SRCZIP=$(find /tmp/v183-artifact -type f -name 'Global-Edge-AI-Trader-v1.8.3-source.zip' | head -n1)
          test -n "$SRCZIP" && test -s "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/v194
          cat signing-repo/fresh-global-edge/v194/transforms/core00.py.part \
              signing-repo/fresh-global-edge/v194/transforms/core01.py.part \
              signing-repo/fresh-global-edge/v194/transforms/core02.py.part \
              signing-repo/fresh-global-edge/v194/transforms/core03.py.part \
              signing-repo/fresh-global-edge/v194/transforms/core04.py.part > /tmp/apply_v184_core.py
          cat signing-repo/fresh-global-edge/v194/transforms/ui00.py.part \
              signing-repo/fresh-global-edge/v194/transforms/ui01.py.part \
              signing-repo/fresh-global-edge/v194/transforms/ui02.py.part \
              signing-repo/fresh-global-edge/v194/transforms/ui04.py.part \
              signing-repo/fresh-global-edge/v194/transforms/ui05.py.part \
              signing-repo/fresh-global-edge/v194/transforms/ui06.py.part \
              signing-repo/fresh-global-edge/v194/transforms/ui99.py.part > /tmp/apply_v184_ui.py
          python /tmp/apply_v184_core.py
          python /tmp/apply_v184_ui.py
          cp signing-repo/fresh-global-edge/v194/source/DiagonalScannerEngine.kt app/src/main/java/com/suhas/ucsentinel/domain/engine/DiagonalScannerEngine.kt
          grep -q 'versionCode = 194' app/build.gradle.kts
          grep -q 'versionName = "1.8.4"' app/build.gradle.kts
          test -f app/src/main/java/com/suhas/ucsentinel/domain/engine/DiagonalScannerEngine.kt
          grep -q 'DIAGONAL_UP' app/src/main/java/com/suhas/ucsentinel/domain/engine/DiagonalScannerEngine.kt
          grep -q 'DIAGONAL_DOWN' app/src/main/java/com/suhas/ucsentinel/domain/engine/DiagonalScannerEngine.kt
          grep -q 'DIAGONAL_STRONG' app/src/main/java/com/suhas/ucsentinel/domain/engine/DiagonalScannerEngine.kt
          ! grep -q 'DIAGONAL_LIVE' app/src/main/java/com/suhas/ucsentinel/domain/engine/DiagonalScannerEngine.kt
          grep -q '3 PM Next-Day Upper Circuit' app/src/main/java/com/suhas/ucsentinel/ui/InformationArchitectureScreens.kt
          grep -q 'Strategy Lab' app/src/main/java/com/suhas/ucsentinel/ui/MoreScreen.kt
          grep -q 'Top 10 company fundamentals tracked' app/src/main/java/com/suhas/ucsentinel/ui/MoreScreen.kt
          grep -q 'provisionalStrategyEligible' app/src/main/java/com/suhas/ucsentinel/domain/engine/AutomationPolicy.kt
          ! grep -q 'ForecastLane.PRESSURE' app/src/main/java/com/suhas/ucsentinel/ui/InformationArchitectureScreens.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build release
        working-directory: /tmp/v194
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          gradle --no-daemon --console=plain clean testDebugUnitTest assembleRelease 2>&1 | tee out/GRADLE-BUILD-TEST.log

      - name: Recover preserved signing material
        uses: actions/download-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.5.0-FINAL
          repository: SuhasSrinivasa1/AI-Trader
          run-id: 36146076154
          github-token: ${{ github.token }}
          path: /tmp/v150-artifact

      - name: Sign and verify update APK
        working-directory: /tmp/v194
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out /tmp/signing
          BACKUP=$(find /tmp/v150-artifact -type f -name 'Global-Edge-AI-Trader-v1.5.0-SIGNING-BACKUP.zip' | head -n1)
          unzip -q "$BACKUP" -d /tmp/signing
          STORE_PASS=$(grep '^store_password=' /tmp/signing/SIGNING-INFO.txt | cut -d= -f2-)
          KEY_PASS=$(grep '^key_password=' /tmp/signing/SIGNING-INFO.txt | cut -d= -f2-)
          UNSIGNED=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*release*.apk' | head -n1)
          OUT=out/Global-Edge-AI-Trader-v1.8.4.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/signing/global-edge-v1.5.0.keystore --ks-pass pass:"$STORE_PASS" --key-pass pass:"$KEY_PASS" --ks-key-alias globaledge --out "$OUT" "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee out/APK-SIGNATURE-VERIFY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | tee out/APK-BADGING.txt
          grep -q "versionCode='194'" out/APK-BADGING.txt
          grep -q "versionName='1.8.4'" out/APK-BADGING.txt
          CERT_SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          test "$CERT_SHA" = '31ffa51c23b76f450cf099d00b254870bf8eacc5ce79aee4458070a0fab783d7'
          sha256sum "$OUT" | tee out/SHA256.txt
          zip -qr out/Global-Edge-AI-Trader-v1.8.4-source.zip . -x '*/.gradle/*' '*/build/*' 'out/*' '*.keystore' '*.jks'

      - name: Upload verified v1.8.4
        uses: actions/upload-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.8.4-FINAL
          retention-days: 90
          if-no-files-found: error
          path: |
            /tmp/v194/out/Global-Edge-AI-Trader-v1.8.4.apk
            /tmp/v194/out/Global-Edge-AI-Trader-v1.8.4-source.zip
            /tmp/v194/out/APK-SIGNATURE-VERIFY.txt
            /tmp/v194/out/APK-BADGING.txt
            /tmp/v194/out/SHA256.txt
